id = "vscode-workspace-sync"
name = "VS Code Workspace Sync"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Keep a VS Code multi-root workspace file in sync with Herdr Spaces"
platforms = ["macos", "linux"]

# No [[build]] block. The plugin is Python source run in place; `herdr plugin install`
# fetches and links with nothing to compile.

[[startup]]
command = ["./bin/sync", "--reason", "startup"]

[[events]]
on = "workspace.created"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "workspace.closed"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "workspace.renamed"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "workspace.moved"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "workspace.reordered"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "workspace.updated"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "workspace.focused"
command = ["./bin/sync", "--reason", "event"]

# Non-workspace events, added after a user report: changing directory in a tab moves
# the Space (Herdr derives a Space's cwd from its active pane -- `cwd` appears only in
# workspace.create, so there is no stored root), but no `workspace.*` event fires.
#
# `pane.updated` is what actually carries the new cwd, and it is NOT hookable: the
# manifest accepts it and it never fires. Of 27 subscription types only 10 reach plugin
# hooks. These five are the hookable ones that fire for *plain* panes, so a `cd` is
# picked up on the next navigation. Measured, not assumed -- see
# docs/herdr-vscode-sync-facts.md probe 18.
#
# `pane.agent_status_changed` is deliberately NOT hooked: it fires ~0.85/s and only for
# panes with a detected agent, so it costs ~8% of a core per agent and does nothing for
# the plain-shell case this is meant to fix.

[[events]]
on = "pane.focused"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "tab.focused"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "pane.created"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "tab.created"
command = ["./bin/sync", "--reason", "event"]

[[events]]
on = "tab.closed"
command = ["./bin/sync", "--reason", "event"]

[[actions]]
id = "sync"
title = "Sync VS Code workspace"
contexts = ["global", "workspace"]
command = ["./bin/sync", "--reason", "action"]

# No `doctor` action on purpose. A plugin action's stdout goes only to
# `herdr plugin log list`, JSON-escaped -- the least legible channel available, and a
# poor route for a diagnostic. Run `./bin/sync --doctor` directly instead; see README.

# The inbound direction: create Spaces from a .code-workspace file's `folders`.
#
# Deliberately NOT an [[events]] hook, and never will be. `folders` is regenerable from
# Herdr, which is why sync can run on twelve of them; a Space is not -- it owns tabs,
# panes, running agents and scrollback -- so importing one can only ever be additive,
# one-shot and explicitly asked for.
#
# The action is a convenience. The primary interface is `./bin/adopt` run directly (or
# the `herdrvs` shell function in ../scripts/), because actions take NO arguments --
# `herdr plugin action invoke` accepts only --plugin -- so there is no --dry-run and no
# --file through this route, and stdout reaches only `herdr plugin log list`,
# JSON-escaped. Same reasoning that keeps `--doctor` a flag rather than an action.
#
# Refuses outright in a session that has a configured workspaceFile: adopt and sync are
# mutually exclusive per session. See src/adopt.py's `guard`.

[[actions]]
id = "adopt"
title = "Adopt VS Code workspace folders as Spaces"
contexts = ["global", "workspace"]
command = ["./bin/adopt", "--reason", "action"]
